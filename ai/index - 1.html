<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Data Visualization - Top 10 Cities (Sorted)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Microsoft YaHei', sans-serif; display: flex; justify-content: center; align-items: center; }
        #canvas-container { 
            /* 设置容器为9:16比例 */
            width: 100vh; 
            height: 100vw; 
            max-width: calc(100vh * 9 / 16); 
            max-height: calc(100vw * 16 / 9); 
            aspect-ratio: 9 / 16;
            background-color: #000; 
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ffffff; font-size: 24px; letter-spacing: 2px; pointer-events: none;
            z-index: 10; white-space: nowrap; font-weight: bold;
        }
        
        .overlay {
            position: absolute; bottom: 30px; left: 30px; color: rgba(255,255,255,0.4);
            font-size: 12px; pointer-events: none; z-index: 5;
        }

        /* 竖屏提示 */
        @media (orientation: landscape) and (max-width: 900px) {
            .orientation-warning { display: flex; }
        }
        .orientation-warning {
            display: none;
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0,0,0,0.95); color: white; font-size: 20px; 
            text-align: center; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999;
        }
        .rotate-icon { font-size: 60px; margin-bottom: 20px; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">LOADING DATA...</div>
    <div id="canvas-container"></div>
    <div class="overlay">HD MODE | ASCENDING ORDER</div>

    <div class="orientation-warning">
        <div class="rotate-icon">📱</div>
        <p>请使用竖屏观看 (9:16)</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import gsap from 'https://unpkg.com/gsap@3.12.5/index.js';

        // --- 用户可配置参数 ---
        const COLUMN_APPEAR_INTERVAL = 5; // 严格设置：每个柱子间隔 5 秒

        // --- 数据 (已颠倒：从少到多) ---
        const CITIES = [
            { name: "南京", value: 60, color: 0xffff00 },
            { name: "武汉", value: 65, color: 0x55ff55 },
            { name: "杭州", value: 68, color: 0xaa00ff },
            { name: "成都", value: 70, color: 0xff5555 },
            { name: "苏州", value: 75, color: 0x00ffff },
            { name: "重庆", value: 80, color: 0xff00ff },
            { name: "广州", value: 85, color: 0xffaa00 },
            { name: "深圳", value: 90, color: 0x00ffaa },
            { name: "北京", value: 95, color: 0x2277ff },
            { name: "上海", value: 100, color: 0xff2255 } 
        ];

        // --- 初始化场景 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111); 
        scene.fog = new THREE.Fog(0x111111, 40, 120);

        const ASPECT_RATIO = 9 / 16; 
        const renderWidth = window.innerHeight * ASPECT_RATIO;
        const renderHeight = window.innerHeight;

        const camera = new THREE.PerspectiveCamera(45, ASPECT_RATIO, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true }); 
        
        renderer.setSize(renderWidth, renderHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        container.appendChild(renderer.domElement);

        // --- 灯光系统 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(20, 50, 30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; 
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
        fillLight.position.set(-20, 20, 20);
        scene.add(fillLight);

        // --- 地面 ---
        const gridHelper = new THREE.GridHelper(200, 100, 0x444444, 0x222222);
        scene.add(gridHelper);
        
        const planeGeometry = new THREE.PlaneGeometry(500, 500);
        const planeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x111111, 
            roughness: 0.5,
            metalness: 0.2
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.1;
        plane.receiveShadow = true;
        scene.add(plane);

        // --- 辅助函数：生成高清无模糊文字 ---
        function createTextSprite(text, colorHex, fontSize = 80, isScore = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; 
            canvas.height = isScore ? 256 : 512; 

            const ctx = canvas.getContext('2d');
            ctx.shadowBlur = 0; // 确保清晰
            
            ctx.font = `Bold ${fontSize}px 'Microsoft YaHei', sans-serif`;
            ctx.fillStyle = '#ffffff'; 
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter; 
            texture.magFilter = THREE.LinearFilter;
            texture.needsUpdate = true;

            const material = new THREE.SpriteMaterial({ 
                map: texture, 
                transparent: true, 
                opacity: 0,
                color: isScore ? colorHex : 0xffffff 
            });
            
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(isScore ? 12 : 18, isScore ? 3 : 9, 1); 
            return sprite;
        }

        // --- 创建柱状体 ---
        const pillars = [];
        const geometry = new THREE.BoxGeometry(3, 1, 3); 
        geometry.translate(0, 0.5, 0); 

        const spacing = 10; 
        // 重新计算起始位置，保证居中
        const startX = -((CITIES.length - 1) * spacing) / 2;

        CITIES.forEach((city, index) => {
            const group = new THREE.Group();
            
            const material = new THREE.MeshStandardMaterial({
                color: city.color, 
                roughness: 0.3,    
                metalness: 0.1,    
                emissive: 0x000000, 
                emissiveIntensity: 0
            });
            const pillar = new THREE.Mesh(geometry, material);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            
            const edges = new THREE.EdgesGeometry(geometry);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
            const wireframe = new THREE.LineSegments(edges, lineMaterial);

            const targetHeight = city.value / 4; 
            pillar.scale.y = 0.01;
            wireframe.scale.y = 0.01;

            group.add(pillar);
            group.add(wireframe);

            // 文字
            const textSprite = createTextSprite(city.name, city.color);
            textSprite.position.set(0, targetHeight + 3.5, 0); 
            group.add(textSprite);

            // 分数 (Top X 逻辑也要倒过来，或者按照顺序排)
            // 因为数据倒过来了（第1个是南京），所以排名应该是 Top 10 (南京) -> Top 1 (上海)
            // 逻辑：CITIES.length - index
            const rank = CITIES.length - index;
            const scoreSprite = createTextSprite(`Top ${rank}`, city.color, 70, true);
            scoreSprite.position.set(0, targetHeight + 1.5, 0);
            group.add(scoreSprite);

            group.position.set(startX + index * spacing, 0, 0);
            scene.add(group);

            pillars.push({
                pillar: pillar,
                wireframe: wireframe,
                text: textSprite,
                score: scoreSprite,
                targetHeight: targetHeight,
                color: city.color
            });
        });

        // --- 粒子 ---
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1000;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) posArray[i] = (Math.random() - 0.5) * 250;
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.4, color: 0xffffff, transparent: true, opacity: 0.4 });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // --- 动画序列 ---
        
        // 计算总动画时长： 柱子数量 * 间隔 + 结尾缓冲
        const TOTAL_DURATION = CITIES.length * COLUMN_APPEAR_INTERVAL + 3;

        camera.position.set(startX - 25, 20, 60); 
        camera.lookAt(startX - 10, 10, 0); 

        const timeline = gsap.timeline();

        timeline.to("#loading", { duration: 0.5, opacity: 0, display: "none" });

        // 重点修改：摄像机运动改为 Linear (匀速)，确保每个时间段移动距离一致
        // 这解决了"后面间隔很短"的问题
        timeline.to(camera.position, {
            x: -startX + 25, 
            duration: TOTAL_DURATION,
            ease: "none" // <--- 关键修改：匀速运动
        }, "start");

        const lookAtTarget = { x: startX - 10, y: 10, z: 0 };
        timeline.to(lookAtTarget, {
            x: -startX + 10,
            duration: TOTAL_DURATION,
            ease: "none", // <--- 关键修改：匀速运动
            onUpdate: function() {
                camera.lookAt(lookAtTarget.x, lookAtTarget.y, lookAtTarget.z);
            }
        }, "start");

        // 柱子动画
        pillars.forEach((item, index) => {
            const delay = 1 + index * COLUMN_APPEAR_INTERVAL;

            // 生长
            timeline.to([item.pillar.scale, item.wireframe.scale], {
                y: item.targetHeight,
                duration: 1.5,
                ease: "back.out(1.2)" 
            }, `start+=${delay}`);

            // 白光闪烁
            timeline.fromTo(item.pillar.material.color, 
                { r: 1, g: 1, b: 1 }, 
                { r: new THREE.Color(item.color).r, g: new THREE.Color(item.color).g, b: new THREE.Color(item.color).b, duration: 0.5 },
                `start+=${delay}`
            );

            // 文字显示
            timeline.to([item.text.material, item.score.material], {
                opacity: 1,
                duration: 0.8
            }, `start+=${delay + 0.5}`);

            // 文字上浮
            timeline.from([item.text.position, item.score.position], {
                y: "-=3",
                duration: 0.8,
                ease: "power2.out"
            }, `start+=${delay + 0.5}`);
        });

        // --- 渲染循环 ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            particlesMesh.rotation.y = t * 0.02;
            
            pillars.forEach((p, i) => {
                if(p.text.material.opacity > 0.5) {
                    p.text.position.y += Math.sin(t * 2 + i) * 0.003;
                }
            });

            renderer.render(scene, camera); 
        }

        function onWindowResize() {
            const newRenderWidth = window.innerHeight * ASPECT_RATIO;
            const newRenderHeight = window.innerHeight;
            camera.aspect = ASPECT_RATIO;
            camera.updateProjectionMatrix();
            renderer.setSize(newRenderWidth, newRenderHeight);
        }
        window.addEventListener('resize', onWindowResize);
        onWindowResize();

        animate();
    </script>
</body>
</html>
